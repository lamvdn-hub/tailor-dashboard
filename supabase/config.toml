# Supabase CLI project config (only the parts this project relies on).
project_id = "tailor-desk"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/reset"]
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.storage-gc]
verify_jwt = true
